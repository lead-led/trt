name: Version Command

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write
  pull-requests: write

jobs:
  handle:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    steps:
      - name: Parse command
        id: command
        run: |
          set -euo pipefail
          body="${{ github.event.comment.body }}"
          # normalize case/whitespace
          body="$(printf '%s' "$body" | tr '[:upper:]' '[:lower:]' | tr -d '\r')"
          body="$(printf '%s' "$body" | xargs)"

          echo "level=patch" >> "$GITHUB_OUTPUT"
          echo "valid=false" >> "$GITHUB_OUTPUT"

          case "${{ github.event.comment.author_association }}" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "Comment ignored: insufficient permissions (${{ github.event.comment.author_association }})." >&2
              exit 0
              ;;
          esac

          case "$body" in
            version:*major*|version*major)
              echo "level=major" >> "$GITHUB_OUTPUT"
              echo "valid=true" >> "$GITHUB_OUTPUT"
              ;;
            version:*minor*|version*minor)
              echo "level=minor" >> "$GITHUB_OUTPUT"
              echo "valid=true" >> "$GITHUB_OUTPUT"
              ;;
            version:*patch*|version*patch)
              echo "level=patch" >> "$GITHUB_OUTPUT"
              echo "valid=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Comment ignored: no version command detected."
              ;;
          esac

      - name: Update labels
        if: steps.command.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          LEVEL: ${{ steps.command.outputs.level }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const level = process.env.LEVEL;
            const labelMap = {
              major: 'release:major',
              minor: 'release:minor',
              patch: 'release:patch'
            };

            const targetLabel = labelMap[level];
            const labelsToRemove = Object.values(labelMap).filter((label) => label !== targetLabel);

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [targetLabel]
            });

      - name: React to comment
        if: steps.command.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
