name: Bump Version On Merge

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-bump-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine bump level
        id: level
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);

            let level = 'patch';
            if (labels.includes('release:major')) {
              level = 'major';
            } else if (labels.includes('release:minor')) {
              level = 'minor';
            }

            core.setOutput('level', level);

      - name: Bump version
        run: node version/${{ steps.level.outputs.level }}.js

      - name: Capture updated version
        id: version
        run: |
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          branch: ${{ github.event.repository.default_branch }}
          file_pattern: package.json
